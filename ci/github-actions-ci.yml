name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий незавершённый прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтер (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Версия ruff зафиксирована: обновление линтера не должно внезапно
      # ломать сборку на неизменившемся коде.
      - name: Установить ruff
        run: pip install ruff==0.16.2

      - name: ruff check
        run: ruff check --output-format=github .

  tests:
    name: Тесты (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # requirements-ci.txt — тот же набор, что и на линии, но без ultralytics
      # (тянет torch) и pywebview (требует GTK): тестам они не нужны, см.
      # комментарий в самом файле.
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Проверить, что все модули компилируются
        run: python -m compileall -q core domain hardware inspection vision config

      - name: pytest
        run: python -m pytest -q
