# Конфигурация линтера для CI и локальных проверок.
#
# Набор правил подобран так, чтобы проверка была зелёной на текущей кодовой
# базе и ловила реальные ошибки (F — неиспользуемые имена, опечатки в
# переменных; E9 — синтаксис; B — типовые ловушки Python). Стилистические
# придирки, требующие массовой переработки живого кода (BLE001 на широких
# except, S110, TRY004), намеренно не включены: они разбираются отдельными
# задачами из CODE_REVIEW.md, а не блокируют каждый PR.

line-length = 120
target-version = "py311"

exclude = [
    "archive",
    "debug_frames",
    "logs",
    "venv",
    ".venv",
]

[lint]
select = [
    "E",    # pycodestyle: ошибки оформления
    "W",    # pycodestyle: предупреждения (хвостовые пробелы, перенос в конце файла)
    "F",    # pyflakes: неиспользуемые импорты и переменные, неопределённые имена
    "I",    # isort: порядок импортов
    "B",    # flake8-bugbear: типовые ловушки
    "UP",   # pyupgrade: устаревшие конструкции
]
ignore = [
    # Плотный однострочный стиль сознательно используется в таблицах команд
    # распределителя и в математике spider-правил, где перенос ухудшает
    # читаемость выравненных блоков.
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    # State и StepStage наследуют (str, Enum) намеренно: переход на StrEnum
    # меняет результат str()/format() для членов перечисления, а эти значения
    # уходят в JSON статуса, логи и сравниваются в UI. Замена требует
    # отдельной проверки всех точек сериализации.
    "UP042",  # class inherits from both str and enum.Enum
]

[lint.per-file-ignores]
# Реэкспорт публичного API пакета — импорты «неиспользуемы» по определению.
"**/__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["config", "core", "domain", "hardware", "inspection", "vision"]
