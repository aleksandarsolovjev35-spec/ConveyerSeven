<text x="30" y="34" font-size="22" font-weight="bold" fill="#f0f6fc">ConveyerSeven — карта UI (монитор линии)</text>
<text x="30" y="56" font-size="12" fill="#8b949e">Браузер (pywebview) → классические JS-модули → FastAPI → ProductionCycle. Шина данных: GET /api/status (адаптивный опрос 60–500 мс).</text>
<text x="70" y="92" font-size="15" font-weight="bold" fill="#58a6ff">1 · DOM (index.html, data-ui-block)</text>
<text x="480" y="92" font-size="15" font-weight="bold" fill="#3fb950">2 · JS-модули (порядок загрузки!)</text>
<text x="905" y="92" font-size="15" font-weight="bold" fill="#d29922">3 · FastAPI (vision/ui/server)</text>
<text x="1265" y="92" font-size="15" font-weight="bold" fill="#bc8cff">4 · Backend (main.py / cycle)</text>
<rect x="30" y="105" width="400" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="123" font-size="13" font-weight="bold" fill="#e6c07b">splash / boot</text>
<text x="40" y="141" font-size="11" fill="#c9d1d9">#splash · прогресс, ошибка, кнопка ЗАКРЫТЬ</text>
<text x="40" y="156" font-size="11" fill="#c9d1d9">скрывается после boot + первых status/jog/cameras</text>
<text x="40" y="171" font-size="11" fill="#8b949e">fetchBoot 150 мс → revealUi() 600 мс</text>
<rect x="30" y="245" width="400" height="118" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="263" font-size="13" font-weight="bold" fill="#e6c07b">operator-header</text>
<text x="40" y="281" font-size="11" fill="#c9d1d9">#state-section · #state-indicator · #state-label</text>
<text x="40" y="296" font-size="11" fill="#c9d1d9">#metric-step · #metric-uptime (1 с, локальный)</text>
<rect x="30" y="373" width="400" height="150" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="391" font-size="13" font-weight="bold" fill="#e6c07b">main-camera + preview-strip</text>
<text x="40" y="409" font-size="11" fill="#c9d1d9">#main-camera (img, двойная буферизация mainBuffer)</text>
<text x="40" y="424" font-size="11" fill="#c9d1d9">#mode-badge  ← ПОТОК/СТОП-КАДР/АНАЛИЗ [был баг]</text>
<text x="40" y="439" font-size="11" fill="#c9d1d9">#camera-view-switch RAW/ПРАВИЛА · #analyze-selected-frame</text>
<text x="40" y="454" font-size="11" fill="#c9d1d9">#camera-overlay — большие состояния (ПАУЗА, АВАРИЯ…)</text>
<text x="40" y="469" font-size="11" fill="#c9d1d9">#preview-strip — 7 миниатюр, клик = selectCamera</text>
<rect x="30" y="533" width="400" height="128" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="551" font-size="13" font-weight="bold" fill="#e6c07b">process-line</text>
<text x="40" y="569" font-size="11" fill="#c9d1d9">#line-cells 8 ячеек + .line-token (маркеры деталей)</text>
<text x="40" y="584" font-size="11" fill="#c9d1d9">.line-gate-in/out · #scada-actuator (DIST2, пневмо)</text>
<text x="40" y="599" font-size="11" fill="#c9d1d9">#process-phase-label</text>
<rect x="30" y="671" width="400" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="689" font-size="13" font-weight="bold" fill="#e6c07b">history-strip</text>
<text x="40" y="707" font-size="11" fill="#c9d1d9">#history-cards — последние 10 деталей</text>
<text x="40" y="722" font-size="11" fill="#c9d1d9">клик по карточке → openGallery(partId)</text>
<rect x="30" y="741" width="400" height="204" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="759" font-size="13" font-weight="bold" fill="#e6c07b">right-panel (stats-panel)</text>
<text x="40" y="777" font-size="11" fill="#c9d1d9">#stats-summary (статистика цикла 2+3)</text>
<text x="40" y="792" font-size="11" fill="#c9d1d9">#defects-section — топ дефектов (RUNNING/STOPPING)</text>
<text x="40" y="807" font-size="11" fill="#c9d1d9">#stats-service — пустые лотки</text>
<text x="40" y="822" font-size="11" fill="#c9d1d9">#distributor-diagnostics — DIST1/DIST2 карты</text>
<text x="40" y="837" font-size="11" fill="#c9d1d9">   blade-маркеры ← distN_position / distN_max</text>
<text x="40" y="852" font-size="11" fill="#c9d1d9">   4 кнопки: DIST1_HOME/OPEN · DIST2_BAD/CLEANUP</text>
<text x="40" y="867" font-size="11" fill="#c9d1d9">#jog-panel — 2 кнопки удержания ленты</text>
<text x="40" y="882" font-size="11" fill="#f85149">✗ удалён мёртвый блок prestart-diagnostics:</text>
<text x="40" y="897" font-size="11" fill="#f85149">  JS+эндпоинты были, HTML нет → убрано из JS</text>
<text x="40" y="912" font-size="11" fill="#8b949e">  (тест test_ui_layout требовал его отсутствия)</text>
<text x="40" y="927" font-size="11" fill="#c9d1d9">#frame-analysis-panel — МОДЕЛИ/ПРАВИЛА по кадру</text>
<rect x="30" y="955" width="400" height="62" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="973" font-size="13" font-weight="bold" fill="#e6c07b">operator-footer + gallery-modal</text>
<text x="40" y="991" font-size="11" fill="#c9d1d9">#btn-start/pause/resume/stop/exit + хоткеи F5–F11</text>
<text x="40" y="1006" font-size="11" fill="#c9d1d9">#gallery-modal — архив детали (RAW/ПРАВИЛА)</text>
<rect x="455" y="105" width="420" height="96" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="465" y="123" font-size="13" font-weight="bold" fill="#e6c07b">core.js — состояние и шина</text>
<text x="465" y="141" font-size="11" fill="#c9d1d9">state{}, els{} (кэш DOM), apiGet/apiPost</text>
<text x="465" y="156" font-size="11" fill="#c9d1d9">адаптивный опрос: 60 мс движение / 100 рабочий / 500 idle</text>
<text x="465" y="171" font-size="11" fill="#c9d1d9">OFFLINE через 1500 мс без ответа</text>
<rect x="455" y="211" width="420" height="72" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="465" y="229" font-size="13" font-weight="bold" fill="#e6c07b">boot.js — заставка</text>
<text x="465" y="247" font-size="11" fill="#c9d1d9">fetchBoot → /api/boot до active=false</text>
<text x="465" y="262" font-size="11" fill="#c9d1d9">checkUiReady: status+jog+cameras (таймаут 20 c)</text>
<rect x="455" y="293" width="420" height="118" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="465" y="311" font-size="13" font-weight="bold" fill="#e6c07b">status.js — главный рендер-цикл</text>
<text x="465" y="329" font-size="11" fill="#c9d1d9">fetchStatus() → updateLineStatus(ls):</text>
<text x="465" y="344" font-size="11" fill="#c9d1d9">кнопки · оверлей · статистика · распределитель</text>
<text x="465" y="359" font-size="11" fill="#c9d1d9">updateLineCells() — токены деталей; SCADA-ворота</text>
<text x="465" y="374" font-size="11" fill="#c9d1d9">_updateDistributorColorCoding()</text>
<text x="465" y="389" font-size="11" fill="#d29922">updateSelectedAnalysisStatus / FrameAnalysisStatus</text>
<rect x="455" y="421" width="420" height="92" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="465" y="439" font-size="13" font-weight="bold" fill="#e6c07b">cameras.js — кадры и режимы</text>
<text x="465" y="457" font-size="11" fill="#c9d1d9">pull (стоп-кадр по frame_version) ↔ live-pull (движение)</text>
<text x="465" y="472" font-size="11" fill="#c9d1d9">applyMainCameraSource · maybeRequestMainFrame</text>
<text x="465" y="487" font-size="11" fill="#3fb950">✓ fixed: applyModeUI → applyLiveBadge (бейдж виден)</text>
<rect x="455" y="523" width="420" height="92" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="465" y="541" font-size="13" font-weight="bold" fill="#e6c07b">controls.js — команды линии</text>
<text x="465" y="559" font-size="11" fill="#c9d1d9">submitControl: pending-замок + блокировка всех</text>
<text x="465" y="574" font-size="11" fill="#c9d1d9">     физических действий до ответа</text>
<text x="465" y="589" font-size="11" fill="#c9d1d9">applyButtonsForState ← ls.controls (разрешения backend)</text>
<text x="465" y="604" font-size="11" fill="#c9d1d9">updateStateOverlay — текстовые состояния на кадре</text>
<rect x="455" y="625" width="420" height="112" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="465" y="643" font-size="13" font-weight="bold" fill="#e6c07b">jog.js + diagnostics.js + history.js</text>
<text x="465" y="661" font-size="11" fill="#c9d1d9">jog: dead-man: hold/start → heartbeat 100 мс → release</text>
<text x="465" y="676" font-size="11" fill="#c9d1d9">   auto enter/exit по состоянию (IDLE/STOPPED/PAUSED)</text>
<text x="465" y="691" font-size="11" fill="#c9d1d9">diagnostics: команды распределителя + анализ 3 кадров</text>
<text x="465" y="706" font-size="11" fill="#c9d1d9">history: карточки, дефекты, галерея архива</text>
<rect x="455" y="747" width="420" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="465" y="765" font-size="13" font-weight="bold" fill="#e6c07b">bootstrap.js — инициализация</text>
<text x="465" y="783" font-size="11" fill="#c9d1d9">init(): обработчики + интервалы + хоткеи</text>
<text x="465" y="798" font-size="11" fill="#c9d1d9">тестовый крючок __TRANSPORTER_UI_TEST__</text>
<rect x="455" y="817" width="420" height="200" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="465" y="835" font-size="13" font-weight="bold" fill="#e6c07b">Интервалы (init)</text>
<text x="465" y="853" font-size="11" fill="#c9d1d9">fetchBoot 150 мс (до готовности)</text>
<text x="465" y="868" font-size="11" fill="#c9d1d9">fetchStatus: STATUS_INTERVAL_* (адаптивно)</text>
<text x="465" y="883" font-size="11" fill="#c9d1d9">fetchCameras 2000 мс · refreshPreviewStrip 180 мс</text>
<text x="465" y="898" font-size="11" fill="#c9d1d9">updateUptime 1000 мс</text>
<text x="465" y="913" font-size="11" fill="#8b949e">Все запросы не перекрываются (*FetchBusy-флаги),</text>
<text x="465" y="928" font-size="11" fill="#8b949e">polling не накладывается сам на себя.</text>
<rect x="900" y="105" width="340" height="168" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="910" y="123" font-size="13" font-weight="bold" fill="#e6c07b">Запросы состояния</text>
<text x="910" y="141" font-size="11" fill="#c9d1d9">GET /api/boot  ·  GET /api/status</text>
<text x="910" y="156" font-size="11" fill="#c9d1d9">GET /api/cameras · GET /api/mode</text>
<text x="910" y="171" font-size="11" fill="#c9d1d9"></text>
<text x="910" y="186" font-size="11" fill="#3fb950">status: line_status{state, controls, jog, live,</text>
<text x="910" y="201" font-size="11" fill="#3fb950"> process, line_parts, dist*, frame_analysis,</text>
<text x="910" y="216" font-size="11" fill="#3fb950"> diagnostics…}, recent_parts, mode,</text>
<text x="910" y="231" font-size="11" fill="#3fb950"> frame_version(s), active_camera</text>
<rect x="900" y="283" width="340" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="910" y="301" font-size="13" font-weight="bold" fill="#e6c07b">Управление линией</text>
<text x="910" y="319" font-size="11" fill="#c9d1d9">POST /api/start /stop /pause /resume /exit</text>
<text x="910" y="334" font-size="11" fill="#8b949e">invoke(): 503 нет callback · 409 отказ · 500 ошибка</text>
<rect x="900" y="393" width="340" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="910" y="411" font-size="13" font-weight="bold" fill="#e6c07b">Камеры и кадры</text>
<text x="910" y="429" font-size="11" fill="#c9d1d9">POST /api/mode/{RAW|RULES} · /api/active_camera/{role}</text>
<text x="910" y="444" font-size="11" fill="#c9d1d9">GET /frame/{role}?mode&amp;preview (pull, JPEG-кэш)</text>
<text x="910" y="459" font-size="11" fill="#c9d1d9">GET /stream/{role} (MJPEG, сейчас не используется)</text>
<rect x="900" y="503" width="340" height="118" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="910" y="521" font-size="13" font-weight="bold" fill="#e6c07b">Диагностика и JOG</text>
<text x="910" y="539" font-size="11" fill="#c9d1d9">POST /api/diagnostics/selected/{role} · /release</text>
<text x="910" y="554" font-size="11" fill="#c9d1d9">POST /api/distributor/diagnostic/{DIST*}</text>
<text x="910" y="569" font-size="11" fill="#c9d1d9">POST /api/diagnostics/cameras · /vision-rules</text>
<text x="910" y="584" font-size="11" fill="#c9d1d9">POST /api/jog/enter · /exit</text>
<text x="910" y="599" font-size="11" fill="#c9d1d9">POST /api/jog/hold/start · /heartbeat · /release</text>
<rect x="900" y="631" width="340" height="78" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="910" y="649" font-size="13" font-weight="bold" fill="#e6c07b">Архив</text>
<text x="910" y="667" font-size="11" fill="#c9d1d9">GET /api/archive/part/{id}  → meta + roles[]</text>
<text x="910" y="682" font-size="11" fill="#c9d1d9">GET /api/archive/image/{id}/{role}/{raw|raw_overlay|debug}</text>
<rect x="900" y="719" width="340" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="910" y="737" font-size="13" font-weight="bold" fill="#e6c07b">UIServer (server.py)</text>
<text x="910" y="755" font-size="11" fill="#c9d1d9">update(frames, vision_results, rule_results,</text>
<text x="910" y="770" font-size="11" fill="#c9d1d9">   line_status, recent_parts) — под threading.Lock</text>
<text x="910" y="785" font-size="11" fill="#c9d1d9">JPEG-кэш: (role, mode, size) → версии кадров</text>
<text x="910" y="800" font-size="11" fill="#c9d1d9">set_mode: сброс кэша + повышение версии</text>
<rect x="1265" y="105" width="250" height="168" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="1275" y="123" font-size="13" font-weight="bold" fill="#e6c07b">main.py</text>
<text x="1275" y="141" font-size="11" fill="#c9d1d9">LiveMonitor = UIServer + pywebview</text>
<text x="1275" y="156" font-size="11" fill="#c9d1d9">колбэки on_start/on_jog/... →</text>
<text x="1275" y="171" font-size="11" fill="#c9d1d9">   ProductionCycle</text>
<text x="1275" y="186" font-size="11" fill="#c9d1d9">exit: штатный → 2-е нажатие = force</text>
<text x="1275" y="201" font-size="11" fill="#8b949e">ui_demo.py — режим run_ui_only.bat</text>
<text x="1275" y="216" font-size="11" fill="#3fb950">✓ fixed: + блок live в line_status</text>
<rect x="1265" y="283" width="250" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="1275" y="301" font-size="13" font-weight="bold" fill="#e6c07b">ProductionCycle</text>
<text x="1275" y="319" font-size="11" fill="#c9d1d9">_build_status(): все поля line_status</text>
<text x="1275" y="334" font-size="11" fill="#c9d1d9">_refresh_monitor() каждый тик цикла</text>
<text x="1275" y="349" font-size="11" fill="#c9d1d9">live.streaming в движении, live.static на</text>
<text x="1275" y="364" font-size="11" fill="#c9d1d9">   этапах анализа (стоп-кадр)</text>
<rect x="1265" y="423" width="250" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="1275" y="441" font-size="13" font-weight="bold" fill="#e6c07b">Vision / Hardware</text>
<text x="1275" y="459" font-size="11" fill="#c9d1d9">7 камер (YOLO) · defect rules</text>
<text x="1275" y="474" font-size="11" fill="#c9d1d9">контроллер: конвейер + DIST1/DIST2</text>
<text x="1275" y="489" font-size="11" fill="#c9d1d9">encoder / serial transport</text>
